[package]
# `driftdb` is taken on crates.io (an unrelated real-time backend), so the package is
# published as `driftdb-lsm`; the library keeps the `driftdb` import path (see [lib]).
name = "driftdb-lsm"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["Bunty9 <Bunty9@users.noreply.github.com>"]
license = "MIT OR Apache-2.0"
description = "Embeddable LSM-tree key-value engine with WAL group-commit, MVCC snapshot reads, and leveled compaction."
repository = "https://github.com/Bunty9/driftdb"
homepage = "https://github.com/Bunty9/driftdb"
documentation = "https://docs.rs/driftdb-lsm"
readme = "README.md"
keywords = ["lsm", "storage-engine", "key-value", "wal", "mvcc"]
categories = ["database-implementations", "data-structures"]
# Ship only what builds and documents the crate; design notes and CI config stay in the repo.
include = [
    "/src",
    "/tests",
    "/benches",
    "/examples",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

[lib]
name = "driftdb"

[package.metadata.docs.rs]
# Linux-only for now (fdatasync + flock); see the compile_error! in lib.rs.
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
# Not the execution model here — the WAL writer and background flush/compaction threads are
# plain `std::thread`s, and `fdatasync`/group-commit run on them directly. tokio is only used
# for the `oneshot` ack channel between callers and the writer thread, and `spawn_blocking` to
# run that blocking work off of a caller's async task (`Db::open`, `scan`, `flush`, `compact`,
# `close`). Kept to just the features that cover that: "rt" for `spawn_blocking`, "sync" for
# `oneshot`.
tokio = { version = "1.47", features = ["sync", "rt"] }

# Concurrent memtable (lock-free skiplist) — the canonical pick from `backend-cloud-roadmap.md` § 3.
crossbeam-skiplist = "0.1"

# Block compression for SSTable data blocks. Level 3 is the LevelDB/RocksDB default.
zstd = "0.13"

# WAL record checksums.
crc32fast = "1"

# Per-SSTable bloom filter to short-circuit negative point lookups.
growable-bloom-filter = "2"

# mmap-backed SSTable reads — the read path opens an SST once and lets the OS page in blocks.
memmap2 = "0.9"

# Low-overhead Mutex for compactor state + level metadata. `std::sync::Mutex` is fine but parking_lot
# has the better fast-path here.
parking_lot = "0.12"

# `libc::fdatasync` for WAL group-commit. The crate is a transitive of `tokio` already; pinning
# directly so we don't accidentally drop it.
libc = "0.2"

# bincode for the SSTable index + bloom serialization and the manifest log. Pinned to the 1.x
# series intentionally — 2.x rewrites the API and we want the stable shape for now (see
# README "Design tradeoffs" § "bincode for index serialization").
bincode = "1.3"

# Manifest records are `Serialize`/`Deserialize`.
serde = { version = "1", features = ["derive"] }

# Errors: `thiserror` for the library surface.
thiserror = "2"

# Structured logging. The library emits spans/events; binaries set up the subscriber.
tracing = "0.1"

[dev-dependencies]
# Property tests for the SST iterator + memtable ordering invariants.
proptest = "1"
# Benchmarks.
criterion = "0.5"
# Throwaway directories for integration tests + the quickstart example.
tempfile = "3"
# The integration test binary needs the full tokio feature set to spin up the runtime.
tokio = { version = "1.47", features = ["full"] }

[[bench]]
name = "throughput"
harness = false

[[bench]]
name = "ycsb"
harness = false

[[bench]]
name = "report"
harness = false

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
