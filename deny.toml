# cargo-deny configuration. See: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false
no-default-features = false

[advisories]
version = 2
yanked = "warn"
ignore = [
    # bincode 1.x is unmaintained, but it is feature-complete and pinned on purpose:
    # the SST index/bloom and manifest formats are defined by its 1.x encoding
    # (README "bincode for index serialization"). Replacing it is a format change.
    { id = "RUSTSEC-2025-0141", reason = "bincode 1.x pinned; on-disk format depends on it" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "MPL-2.0",
    "CC0-1.0",
    "OpenSSL",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
